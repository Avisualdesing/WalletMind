<style>

:root{
  --bg:oklch(0.972 0.008 280);--fg:oklch(0.2 0.03 275);--card:oklch(0.995 0.003 280);
  --muted:oklch(0.945 0.011 280);--muted-fg:oklch(0.5 0.03 275);
  --primary:oklch(0.45 0.17 281);--primary-fg:oklch(0.99 0 0);--glow:oklch(0.8 0.12 172);--gold:oklch(0.83 0.095 85);
  --danger:oklch(0.6 0.19 18);--ok:oklch(0.56 0.12 172);--warn:oklch(0.7 0.14 70);
  --border:oklch(0.25 0.04 275 / 8%);--input:oklch(0.25 0.04 275 / 14%);
  --ink:oklch(0.25 0.075 278);--overlay:oklch(0.15 0.04 275 / 0.5);
  --shadow:0 1px 0 oklch(1 0 0 / 0.08) inset,0 30px 50px -28px oklch(0.25 0.1 278 / 0.6);
  --halo:oklch(0.7 0.14 290 / 0.16);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --spring:linear(0,.18 5%,.52 11%,.8 18%,.97 26%,1.025 33%,1.03 38%,1.01 47%,.998 58%,1);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@supports not (transition-timing-function:linear(0,1)){:root{--spring:cubic-bezier(.34,1.3,.64,1)}}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:oklch(0.145 0.02 278);--fg:oklch(0.96 0.008 280);--card:oklch(0.2 0.025 278);
    --muted:oklch(0.25 0.025 278);--muted-fg:oklch(0.72 0.03 280);
    --primary:oklch(0.76 0.12 285);--primary-fg:oklch(0.17 0.05 280);
    --danger:oklch(0.72 0.16 18);--ok:oklch(0.78 0.13 172);--warn:oklch(0.82 0.13 75);
    --border:oklch(1 0 0 / 8%);--input:oklch(1 0 0 / 14%);
    --ink:oklch(0.27 0.08 280);--overlay:oklch(0 0 0 / 0.6);
    --shadow:0 1px 0 oklch(1 0 0 / 0.1) inset,0 30px 50px -28px oklch(0 0 0 / 0.75);
    --halo:oklch(0.55 0.15 290 / 0.22);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:oklch(0.145 0.02 278);--fg:oklch(0.96 0.008 280);--card:oklch(0.2 0.025 278);
  --muted:oklch(0.25 0.025 278);--muted-fg:oklch(0.72 0.03 280);
  --primary:oklch(0.76 0.12 285);--primary-fg:oklch(0.17 0.05 280);
  --danger:oklch(0.72 0.16 18);--ok:oklch(0.78 0.13 172);--warn:oklch(0.82 0.13 75);
  --border:oklch(1 0 0 / 8%);--input:oklch(1 0 0 / 14%);
  --ink:oklch(0.27 0.08 280);--overlay:oklch(0 0 0 / 0.6);
  --shadow:0 1px 0 oklch(1 0 0 / 0.1) inset,0 30px 50px -28px oklch(0 0 0 / 0.75);
  --halo:oklch(0.55 0.15 290 / 0.22);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 "Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,a,label,[role=button]{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .55s var(--spring),background-color .15s,opacity .15s}
button:active,a.tile:active{transform:scale(.95);transition-duration:.07s}
a.card:active,div.card[role=button]:active{transform:scale(.975);transition-duration:.07s}
a.card,a.tile,div.card[role=button]{transition:transform .55s var(--spring)}
div.card[role=button]{cursor:pointer}
button:disabled{opacity:.5}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1{font-family:"Instrument Serif","Iowan Old Style",Georgia,serif;font-size:2.2rem;font-weight:400;letter-spacing:-.015em;margin:0;line-height:1.08}
h2{font-size:1.0625rem;font-weight:600;letter-spacing:-.015em;margin:0}
p{margin:0}
.tnum{font-variant-numeric:tabular-nums}

.wrap{max-width:36rem;margin:0 auto;padding:22px 16px 180px;position:relative}
.wrap::before{content:"";position:absolute;left:0;right:0;top:0;height:340px;background:radial-gradient(60% 100% at 50% 0,var(--halo),transparent 70%);pointer-events:none;z-index:-1}

.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px}
.eyebrow{font-size:14px;color:var(--muted-fg)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--muted-fg);display:grid;place-items:center;flex:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.link{font-size:13px;font-weight:500;color:var(--primary);display:inline-flex;align-items:center;gap:2px;background:none;border:0;padding:4px 0}
.link svg.i{width:15px;height:15px}

.card{background:var(--card);border:1px solid var(--border);border-radius:1.5rem;padding:16px;box-shadow:inset 0 1px 0 oklch(1 0 0 / .55),0 10px 28px -20px oklch(0.25 0.08 278 / .35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{box-shadow:inset 0 1px 0 oklch(1 0 0 / .07),0 10px 28px -20px oklch(0 0 0 / .6)}}
:root[data-theme="dark"] .card{box-shadow:inset 0 1px 0 oklch(1 0 0 / .07),0 10px 28px -20px oklch(0 0 0 / .6)}
.card+.card{margin-top:12px}
.hero{position:relative;overflow:hidden;border-radius:1.75rem;padding:24px;color:#fff;background:var(--ink);box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 80% at 100% 0,oklch(0.62 0.2 295 / .5),transparent 62%),radial-gradient(70% 60% at 0 100%,oklch(0.83 0.095 85 / .15),transparent 60%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero::after{content:"";position:absolute;inset:0;z-index:0;opacity:.2;mix-blend-mode:soft-light;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.hero .lbl{font-size:14px;font-weight:500;color:rgb(255 255 255 / .62)}
.hero .big{font-size:clamp(2rem,11.5vw,2.75rem);font-weight:300;line-height:1;letter-spacing:-.04em;margin-top:6px;font-variant-numeric:tabular-nums;word-break:break-word}
.split{display:flex;gap:2px;height:6px;border-radius:99px;overflow:hidden;background:rgb(255 255 255 / .12);margin-top:26px}
.split i{display:block;border-radius:99px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.two .k{display:flex;align-items:center;gap:6px;font-size:12px;color:rgb(255 255 255 / .62)}
.two .k b{width:8px;height:8px;border-radius:50%;display:inline-block}
.two .v{font-size:1.1rem;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:0;color:inherit}
.grow{flex:1;min-width:0}
.ttl{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:color-mix(in oklab,oklch(0.7 0.14 var(--h,160)) 18%,transparent)}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--danger)}.warnc{color:var(--warn)}.mut{color:var(--muted-fg)}
.bar{height:6px;border-radius:99px;background:var(--muted);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .5s cubic-bezier(.22,1,.36,1)}
.bar.w i{background:var(--warn)}.bar.d i{background:var(--danger)}
.list>.item{padding:12px 0;border-top:1px solid var(--border)}
.list>.item:first-child{border-top:0;padding-top:0}.list>.item:last-child{padding-bottom:0}
.daygrp+.daygrp{margin-top:22px}
.dayh{display:flex;justify-content:space-between;gap:8px;margin:0 4px 8px;font-size:13px;color:var(--muted-fg)}
.dayh b{font-weight:500;text-transform:capitalize}
.dayh span{font-variant-numeric:tabular-nums;white-space:nowrap}
.donutw{position:relative;width:160px;height:160px;margin:4px auto 14px}
.donutw svg{width:100%;height:100%;display:block}
.donutw .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donutw .c small{font-size:11px;color:var(--muted-fg)}
.donutw .c b{font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini div{background:var(--muted);border-radius:14px;padding:10px 12px}
.mini small{display:block;font-size:11.5px;color:var(--muted-fg)}
.mini b{font-size:.95rem;font-weight:600;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--muted);color:var(--muted-fg)}
.badge.d{background:color-mix(in oklab,var(--danger) 14%,transparent);color:var(--danger)}
.badge.w{background:color-mix(in oklab,var(--warn) 18%,transparent);color:var(--warn)}
.badge.o{background:color-mix(in oklab,var(--ok) 14%,transparent);color:var(--ok)}
.empty{text-align:center;padding:32px 20px;border:1px dashed var(--input);border-radius:1.5rem;color:var(--muted-fg)}
.empty .e{font-size:30px;margin-bottom:6px}.empty b{display:block;color:var(--fg);font-weight:600;margin-bottom:2px}

.seg{display:flex;position:relative;background:var(--muted);border-radius:14px;padding:3px;gap:2px}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n));border-radius:11px;background:var(--card);box-shadow:0 1px 3px oklch(0 0 0 / .14),inset 0 1px 0 oklch(1 0 0 / .5);transform:translateX(calc(var(--i) * 100%));transition:transform .55s var(--spring)}
.seg button{position:relative;z-index:1;flex:1;height:38px;border:0;border-radius:11px;background:transparent;color:var(--muted-fg);font-weight:500;font-size:14px;transition:color .2s}
.seg button[aria-pressed=true]{color:var(--fg)}
.btn{height:50px;border-radius:15px;border:0;font-weight:600;font-size:15px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--primary);color:var(--primary-fg)}
.btn.ghost{background:var(--muted);color:var(--fg)}
.btn.danger{background:color-mix(in oklab,var(--danger) 12%,transparent);color:var(--danger)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.actions.h{flex-direction:row}
input,select,textarea{width:100%;height:50px;border-radius:14px;border:1px solid var(--input);background:var(--card);color:var(--fg);padding:0 14px;font:inherit;font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted-fg) 50%),linear-gradient(135deg,var(--muted-fg) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea{height:96px;padding:12px 14px;resize:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in oklab,var(--primary) 20%,transparent)}
input[type=checkbox]{width:24px;height:24px;border-radius:8px;flex:none;padding:0;position:relative}
input[type=checkbox]:checked{background:var(--primary);border-color:var(--primary)}
input[type=checkbox]:checked::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid var(--primary-fg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.field{margin-top:14px}.field label{display:block;font-size:13px;color:var(--muted-fg);margin:0 0 6px 2px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount{display:flex;align-items:center;gap:8px;border-radius:18px;background:var(--muted);padding:0 18px;height:76px;margin-top:14px}
.amount input{border:0;background:transparent;height:64px;font-size:2rem;font-weight:600;letter-spacing:-.03em;padding:0;box-shadow:none!important;font-variant-numeric:tabular-nums}
.amount input:focus-visible{outline:none}
.amount span{font-size:1.5rem;color:var(--muted-fg);font-weight:500;white-space:nowrap}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pick{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted-fg);min-height:64px}
.pick span{font-size:20px}
.pick[aria-pressed=true]{border-color:var(--primary);background:color-mix(in oklab,var(--primary) 10%,var(--card));color:var(--fg)}
.hint{font-size:13px;color:var(--muted-fg);margin-top:10px}
.swr{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--muted);border-radius:14px;padding:12px 14px;margin-top:14px}
.swr small{display:block;color:var(--muted-fg);font-size:12.5px}
.rcp{margin-top:14px;display:flex;gap:10px;align-items:center}
.rcp img{width:64px;height:64px;object-fit:cover;border-radius:12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--border);font-size:14px}
.kv:first-child{border-top:0}.kv span:first-child{color:var(--muted-fg)}.kv span:last-child{text-align:right;font-weight:500}

.nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:34rem;margin:0 auto;z-index:30;display:flex;gap:4px;padding:6px;border-radius:999px;border:1px solid var(--border);background:color-mix(in oklab,var(--card) 58%,transparent);-webkit-backdrop-filter:blur(28px) saturate(200%);backdrop-filter:blur(28px) saturate(200%);box-shadow:inset 0 1px 0 oklch(1 0 0 / .55),inset 0 -1px 0 oklch(1 0 0 / .1),var(--shadow)}
.nav .lens{position:absolute;left:0;top:6px;bottom:6px;width:0;border-radius:999px;background:linear-gradient(180deg,color-mix(in oklab,var(--primary) 82%,white),var(--primary));box-shadow:inset 0 1px 0 oklch(1 0 0 / .4),0 8px 18px -8px color-mix(in oklab,var(--primary) 80%,transparent);will-change:transform,width}
.nav a{position:relative;z-index:1;flex:1 1 0;min-width:0;overflow:hidden;height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted-fg);font-size:12px;font-weight:500;white-space:nowrap;transition:color .25s}
.nav a span{display:none}
.nav a:active{transform:scale(.95)}
.nav a.on{color:var(--primary-fg)}.nav a.on span{display:inline}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:30;height:56px;min-width:56px;border-radius:20px;border:0;background:var(--primary);color:var(--primary-fg);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font-weight:600;box-shadow:0 12px 24px -8px color-mix(in oklab,var(--primary) 60%,transparent)}
.fab svg.i{width:24px;height:24px;stroke-width:2.5}
.fab[hidden]{display:none}

.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in oklab,var(--overlay) calc(var(--p,0) * 100%),transparent)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:36rem;margin:0 auto;background:color-mix(in oklab,var(--bg) 96%,transparent);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);box-shadow:inset 0 1px 0 oklch(1 0 0 / .5);border-radius:1.9rem 1.9rem 0 0;max-height:92dvh;display:flex;flex-direction:column;will-change:transform}
.sheet-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px 22px;position:relative;touch-action:none}
.sheet-top::before{content:"";position:absolute;top:7px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:9px;background:var(--input)}
.sheet-top b{font-family:"Instrument Serif","Iowan Old Style",Georgia,serif;font-size:1.5rem;font-weight:400;letter-spacing:-.01em;padding-top:8px}
.x{width:34px;height:34px;border-radius:50%;border:0;background:var(--muted);color:var(--muted-fg);display:grid;place-items:center;margin-top:8px}
.x svg.i{width:16px;height:16px}
.sheet-body{overflow:auto;overscroll-behavior:contain;padding:4px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.dlg{position:fixed;inset:0;z-index:60;background:var(--overlay);display:grid;place-items:center;padding:24px;opacity:0;transition:opacity .18s}
.dlg.in{opacity:1}
.dlg>div{background:var(--card);border-radius:1.5rem;padding:22px;max-width:22rem;width:100%;transform:scale(.9);transition:transform .55s var(--spring)}
.dlg.in>div{transform:none}
.dlg h3{margin:0 0 6px;font-size:1.1rem;font-weight:600}
.dlg p{color:var(--muted-fg);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 158px);translate:-50% 14px;scale:.92;z-index:70;background:oklch(0.2 0.04 278 / .94);color:oklch(0.97 0.01 280);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s,translate .5s var(--spring),scale .5s var(--spring);max-width:90vw;text-align:center;pointer-events:none;display:flex;gap:14px;align-items:center}
.toast.in{opacity:1;translate:-50% 0;scale:1}
.toast.act{pointer-events:auto}
.toast button{border:0;background:none;color:var(--gold);font-weight:600;padding:0}
.cf{position:fixed;top:0;width:8px;height:12px;border-radius:2px;z-index:80;pointer-events:none}
.banner{background:color-mix(in oklab,var(--warn) 16%,var(--card));border:1px solid color-mix(in oklab,var(--warn) 40%,transparent);border-radius:16px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}

/* --- movimiento --- */
@keyframes rise{from{opacity:0;transform:translate(var(--dx,0px),12px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes sweep{from{stroke-dashoffset:264}}
@keyframes flash{from{background-color:color-mix(in oklab,var(--primary) 22%,var(--card))}}
.view>*{animation:rise .55s var(--ease-out) backwards;animation-delay:calc(var(--n,0) * 55ms)}
.view .bar i{transform-origin:left;animation:growx .9s var(--ease-out) .3s backwards}
.view .donutw .sw{animation:sweep 1.1s var(--ease-out) .2s backwards}
.view .b i{transform-origin:bottom;animation:growy .8s var(--ease-out) backwards;animation-delay:calc(.3s + var(--n,0) * 50ms)}
.bar.g i{background:linear-gradient(90deg,var(--gold),oklch(0.89 0.08 92))}
.card.list{overflow:hidden}
.swipe{position:relative;overflow:hidden;padding:0!important;margin:0 -16px;border-top:1px solid var(--border)}
.swipe:first-child{border-top:0}
.swipe-bg{position:absolute;inset:0;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:26px;font-weight:600;font-size:14px;opacity:0;cursor:pointer}
.swipe-fg{position:relative;background:var(--card);padding:12px 16px;touch-action:pan-y;will-change:transform}

.hero{will-change:transform}
.hero .gl{position:absolute;inset:0;background:radial-gradient(240px circle at var(--gx,50%) var(--gy,0%),oklch(1 0 0 / .18),transparent 62%);opacity:0;transition:opacity .3s;pointer-events:none}
.hero.tl .gl{opacity:1}
.bars{display:flex;gap:10px;height:112px}
.b{flex:1;position:relative;padding-bottom:22px;display:flex;align-items:flex-end}
.b i{display:block;width:100%;border-radius:9px;background:var(--muted);min-height:4px}
.b.now i{background:var(--primary)}
.b span{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:11.5px;color:var(--muted-fg);text-transform:capitalize}
.fab{transition:transform .55s var(--spring),opacity .2s}
.fab:active{transition-duration:.07s}
.fab.away{transform:translateY(96px) scale(.85);opacity:0;pointer-events:none}
.priv .big,.priv .amt,.priv .v,.priv .mini b,.priv .donutw b{filter:blur(9px)}
.big,.amt,.v,.mini b,.donutw b{transition:filter .35s}
@media (prefers-reduced-transparency:reduce){.nav{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}}

@keyframes pop{from{transform:scale(.7)}}
.chatlog{height:calc(var(--vvh,100dvh)*.42);overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 2px 8px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.msg{max-width:88%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.45;word-wrap:break-word;animation:msgin .5s var(--spring)}
.msg.u{align-self:flex-end;background:var(--primary);color:var(--primary-fg);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:6px}
.sub.wrap{white-space:normal;overflow:visible;text-overflow:clip}
.card .actions.h .btn{white-space:nowrap;padding:0 10px;font-size:14px}
@keyframes msgin{from{opacity:0;transform:translateY(10px) scale(.95)}}

.chip{border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:999px;padding:9px 14px;font-size:14px;text-align:left}
.chatbar{display:flex;gap:8px;margin-top:10px}
.chatbar input{flex:1;min-width:0;height:48px;border-radius:24px;border:1px solid var(--border);background:var(--card);color:var(--fg);padding:0 18px;font:inherit;font-size:16px}

.chatbar .send:disabled{opacity:.45}
@keyframes ringsw{from{stroke-dashoffset:113.1}}
.pick[aria-pressed=true] span{animation:pop .55s var(--spring)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}

.view .ring .rp{animation:ringsw 1s var(--ease-out) .3s backwards}
.tt{font-size:13px;color:var(--muted-fg)}.tv{font-size:1.3rem;letter-spacing:-.02em}

.btn.ghostw{background:rgb(255 255 255 / .14);color:#fff}
.hero .actions.h .btn{height:46px;white-space:nowrap;padding:0 10px;font-size:14px}
.kb .sheet-body{padding-bottom:46vh}

@media (hover:hover) and (pointer:fine){
  .iconbtn:hover,.pick:hover{background:var(--muted)}.btn.primary:hover,.fab:hover{filter:brightness(1.06)}.nav a:not(.on):hover{color:var(--fg)}
}

function addDebt(inp, received) {

    loanTxId = uid();
    S.tx.unshift({ id: loanTxId, type: "income", amount: inp.monto_original, categoryId: "loan_in", date: inp.fecha_inicio || todayIso(), note: "Préstamo: " + inp.nombre, debtId: id, createdAt: Date.now() });
  }
  S.debts.unshift(Object.assign({}, inp, { id, loanTxId, estado: "activa", saldo_pendiente: inp.monto_original, createdAt: Date.now() }));
  persist("tx", "debts");
}
function updateDebt(id, patch) {
  const d = S.debts.find((x) => x.id === id); if (!d) return;
  Object.assign(d, patch);
  const paid = S.pays.filter((p) => p.deuda_id === id).reduce((s, p) => s + p.monto, 0);
  d.saldo_pendiente = Math.max(0, r2(d.monto_original - paid));
  d.estado = d.saldo_pendiente <= 0 ? "pagada" : "activa";
  if (d.loanTxId) { const t = S.tx.find((x) => x.id === d.loanTxId); if (t) t.amount = d.monto_original; }
  persist("debts", "tx");
}
function removeDebt(id) {
  const d = S.debts.find((x) => x.id === id);
  const txIds = new Set(S.pays.filter((p) => p.deuda_id === id && p.txId).map((p) => p.txId));
  if (d && d.loanTxId) txIds.add(d.loanTxId);
  S.tx = S.tx.filter((t) => !txIds.has(t.id));
  S.pays = S.pays.filter((p) => p.deuda_id !== id);
  S.debts = S.debts.filter((x) => x.id !== id);
  persist("tx", "debts", "pays");
}
function addPayment(did, monto, fecha, nota) {
  const d = S.debts.find((x) => x.id === did);
  if (!d) throw new Error("Deuda no encontrada");
  if (!(monto > 0)) throw new Error("El monto debe ser mayor a 0");
  if (monto > d.saldo_pendiente + 0.001) throw new Error("El pago excede el saldo pendiente");
  const pid = uid(), txId = uid();
  S.tx.unshift({ id: txId, type: "expense", amount: monto, categoryId: "debt_payment", date: fecha, note: nota ? d.nombre + " · " + nota : "Pago: " + d.nombre, debtId: did, debtPaymentId: pid, createdAt: Date.now() });
  d.saldo_pendiente = Math.max(0, r2(d.saldo_pendiente - monto));
  d.estado = d.saldo_pendiente <= 0 ? "pagada" : "activa";
  S.pays.unshift({ id: pid, deuda_id: did, monto, fecha, nota, txId });
  persist("tx", "debts", "pays");
  return d.saldo_pendiente <= 0;
}
function removePayment(id) {
  const p = S.pays.find((x) => x.id === id); if (!p) return;
  if (p.txId) S.tx = S.tx.filter((t) => t.id !== p.txId);
  const d = S.debts.find((x) => x.id === p.deuda_id);
  if (d) { d.saldo_pendiente = Math.min(d.monto_original, r2(d.saldo_pendiente + p.monto)); d.estado = "activa"; }
  S.pays = S.pays.filter((x) => x.id !== id);
  persist("tx", "debts", "pays");
}

function payoffPlan(budget, strat, list) {
  const ds = (list || S.debts.filter((d) => d.estado === "activa")).filter((d) => d.saldo_pendiente > 0).map((d) => ({ id: d.id, n: d.nombre, b: d.saldo_pendiente, r: (d.tasa_interes || 0) / 1200, m: d.pago_minimo || 0 }));
  if (!ds.length || !(budget > 0)) return null;
  const order = ds.slice().sort(strat === "sn" ? (x, y) => x.b - y.b : (x, y) => y.r - x.r || x.b - y.b);
  let months = 0, interest = 0; const done = {};
  while (ds.some((d) => d.b > 0.005) && months < 600) {
    months++; let pool = budget;
    ds.forEach((d) => { if (d.b > 0) { const i = d.b * d.r; d.b += i; interest += i; } });
    ds.forEach((d) => { if (d.b > 0) { const q = Math.min(d.m, d.b, pool); d.b -= q; pool -= q; } });
    order.forEach((d) => { if (d.b > 0 && pool > 0) { const q = Math.min(d.b, pool); d.b -= q; pool -= q; } });
    ds.forEach((d) => { if (d.b <= 0.005 && done[d.id] === undefined) done[d.id] = months; });
  }
  const ok = !ds.some((d) => d.b > 0.005);
  return { months: ok ? months : null, interest, order: order.map((d) => ({ n: d.n, at: done[d.id] })) };
}

}

function fitSheet() {
  const c = cur, vv = window.visualViewport; if (!c || !vv) return;
  document.documentElement.style.setProperty("--vvh", vv.height + "px"); c.el.style.top = vv.offsetTop + "px"; c.el.style.bottom = "auto"; c.el.style.height = vv.height + "px";

/* Arrastre 1:1 con el dedo, resistencia elástica hacia arriba, y al soltar: velocidad + inercia proyectada */
function bindDrag(c) {
  const sh = c.sh, top = $(".sheet-top", sh);
  sh.addEventListener("pointerdown", (e) => {
    if (c.closing || (e.pointerType === "mouse" && e.button !== 0) || e.target.closest("input,textarea,select,.chatlog")) return;
    const fromTop = top.contains(e.target);
    if (!fromTop && c.body.scrollHeight > c.body.clientHeight + 1) return;
    const id = e.pointerId, hist = [{ t: e.timeStamp, y: e.clientY }];
    let y0 = e.clientY, base = c.ty, on = false;
    const stop = () => { sh.removeEventListener("pointermove", move); sh.removeEventListener("pointerup", end); sh.removeEventListener("pointercancel", end); };
    const move = (ev) => {
      if (ev.pointerId !== id) return;
      let dy = ev.clientY - y0;
      if (!on) {
        if (Math.abs(dy) < 8) return;
        if (dy < 0 && !fromTop) return stop();
        on = true; const s = live.get("sheet"); if (s) { base = s.x; s.stop(); } y0 = ev.clientY; dy = 0;
        try { sh.setPointerCapture(id); } catch (x) {}
      }
      const y = base + dy; paint(c, y < 0 ? -rubber(-y, c.H) : y);
      hist.push({ t: ev.timeStamp, y: ev.clientY }); if (hist.length > 6) hist.shift();
    };
    const end = (ev) => {
      if (ev.pointerId !== id) return; stop(); if (!on) return; lastDrag = performance.now();
      const v = vel(hist, "y"); c.v = v;
      if (c.ty > 0 && (c.ty + project(v) > c.H * 0.5 || v > 900)) { buzz(6); closeSheet(); }
      else spring("sheet", c.ty, 0, { v, response: 0.4, damping: Math.abs(v) > 300 ? 0.8 : 1, eps: 0.1, onUpdate: (y) => paint(c, y) });
    };
    sh.addEventListener("pointermove", move); sh.addEventListener("pointerup", end); sh.addEventListener("pointercancel", end);
  });
}

/* ============ respaldo en la nube (db privada del usuario) ============ */
const cloud = { ok: false, auto: false, col: null, last: 0, busy: false };
async function initCloud() {
  try {
    if (!window.claude || !claude.use) return;
    const db = await claude.use("db"), user = await claude.use("user"); if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    cloud.col = db.collection("data/users/" + id); cloud.ok = true;
  } catch (e) { cloud.ok = false; }
}
async function cloudMeta() { try { const m = await cloud.col.doc("meta").get(); return m.exists ? m.data() : null; } catch (e) { cloud.ok = false; return null; } }
async function backupNow() {
  if (!cloud.ok || cloud.busy) return false; cloud.busy = true;
  try {
    const json = JSON.stringify(snapshot(false)), parts = []; for (let i = 0; i < json.length; i += 70000) parts.push(json.slice(i, i + 70000));
    const old = await cloudMeta();
    for (let i = 0; i < parts.length; i++) await cloud.col.doc("p" + i).set({ s: parts[i] });
    await cloud.col.doc("meta").set({ n: parts.length, at: Date.now(), tx: S.tx.length });
    if (old && old.n > parts.length) for (let i = parts.length; i < old.n; i++) await cloud.col.doc("p" + i).delete();
    cloud.last = Date.now(); return true;
  } catch (e) { return false; } finally { cloud.busy = false; }
}
async function restoreCloud() {
  const m = await cloudMeta(); if (!m) return false;
  let json = ""; for (let i = 0; i < m.n; i++) { const d = await cloud.col.doc("p" + i).get(); json += d.data().s; }
  const data = JSON.parse(json), keep = new Map(S.tx.filter((t) => t.receipt).map((t) => [t.id, t.receipt]));
  applySnapshot(data); S.tx.forEach((t) => { if (keep.has(t.id)) t.receipt = keep.get(t.id); }); persist("tx"); return true;
}
async function cloudWipe() { const m = await cloudMeta(); if (!m) return; for (let i = 0; i < m.n; i++) await cloud.col.doc("p" + i).delete(); await cloud.col.doc("meta").delete(); }
let bt; function scheduleBackup() { if (!cloud.ok || !cloud.auto) return; clearTimeout(bt); bt = setTimeout(() => { backupNow().then(() => { if (route() === "ajustes" && !cur) render(); }); }, 4000); }

  perf() { numSheet({ title: "Rendimiento estimado", prefix: "", suffix: "%", value: S.perf || "", allowNeg: true, help: "Ingresa cuánto ha subido o bajado tu portafolio en total. Ej. 8 para +8% o -3 para una pérdida.", onSave(v) { S.perf = v; persist("perf"); render(); } }); },
  goal() { numSheet({ title: "Meta de ahorro mensual", prefix: sym(), value: S.goal || "", removable: !!S.goal, help: "Cuenta lo que registres en la categoría Ahorros cada mes.", onSave(v) { S.goal = v; persist("goal"); render(); }, onRemove() { S.goal = 0; persist("goal"); render(); } }); },
  budget(el) {
    const c = cat(el.dataset.id), id = c.id;
    numSheet({ title: "Límite · " + c.n, prefix: sym(), value: S.bud[id] || "", removable: !!S.bud[id], help: "Cuánto quieres gastar como máximo en esta categoría cada mes.", onSave(v) { if (v > 0) S.bud[id] = v; else delete S.bud[id]; persist("bud"); render(); }, onRemove() { delete S.bud[id]; persist("bud"); render(); } });
  },
  async export() {
    const data = JSON.stringify(snapshot(true), null, 2), name = "walletmind-" + todayIso() + ".json";
    try { const dl = window.claude && claude.use ? await claude.use("downloads") : null; if (dl) { await dl.save({ filename: name, data }); toast("Copia lista"); return; } } catch (e) { if (e && e.code === "declined") return; }
    try { const file = new File([data], name, { type: "application/json" }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Respaldo de WalletMind" }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
    if (NATIVE) { try { const PL = window.Capacitor.Plugins, f = await PL.Filesystem.writeFile({ path: name, data, directory: "CACHE", encoding: "utf8" }); await PL.Share.share({ title: "Respaldo de WalletMind", url: f.uri, dialogTitle: "Guardar respaldo" }); return; } catch (e) { if (/cancel/i.test(String((e && e.message) || e))) return; } }
    try { await navigator.clipboard.writeText(data); toast("Copia en el portapapeles"); } catch (e) { toast("No se pudo exportar en este navegador"); }
  },
  import() {
    openSheet({
      title: "Importar datos",
      html: '<p class="hint" style="margin-top:0">Elige un archivo .json exportado desde WalletMind (también sirve el de tu app anterior). Reemplazará los datos actuales.</p><label class="btn primary" style="margin-top:14px;cursor:pointer">Elegir archivo<input id="imp-file" type="file" accept=".json,application/json" hidden></label><div class="field"><label for="imp-txt">…o pega el contenido aquí</label><textarea id="imp-txt" placeholder="{ ... }"></textarea></div><div class="actions"><button class="btn ghost" data-a="ok">Importar texto pegado</button></div>',
      onInput(e) { if (e.target.id === "imp-file" && e.target.files[0]) { const rd = new FileReader(); rd.onload = () => doImport(String(rd.result)); rd.readAsText(e.target.files[0]); } },
      acts: { ok() { doImport($("#imp-txt", cur.el).value); } },
    });
  },
  async backup() { if (!cloud.ok) return toast("Respaldo en la nube no disponible"); toast("Respaldando…"); toast((await backupNow()) ? "Respaldo guardado" : "No se pudo respaldar"); cloud.auto = true; render(); },
  async restore() {
    if (!cloud.ok) return toast("Respaldo en la nube no disponible");
    const m = await cloudMeta(); if (!m) return toast("Aún no hay un respaldo guardado");
    if (!(await confirmDlg({ title: "¿Restaurar respaldo?", text: "Se reemplazarán los datos de este dispositivo por la copia del " + new Date(m.at).toLocaleDateString("es-ES", { day: "numeric", month: "long" }) + " (" + m.tx + " movimientos).", ok: "Restaurar" }))) return;
    try { await restoreCloud(); cloud.auto = true; render(); toast("Datos restaurados"); } catch (e) { toast("No se pudo restaurar"); }
  },
  async reset() {
    if (!(await confirmDlg({ title: "¿Borrar todos los datos?", text: "Se eliminarán movimientos, deudas, presupuestos y el respaldo en la nube. No se puede deshacer.", ok: "Borrar todo", danger: true }))) return;
    S.tx = []; S.debts = []; S.pays = []; S.bud = {}; S.goal = 0; S.perf = 0; S.plan = defPlan();
    ["tx", "debts", "pays", "bud", "goal", "perf", "plan"].forEach((n) => persist(n));
    if (cloud.ok) { cloud.auto = false; clearTimeout(bt); try { await cloudWipe(); } catch (e) {} cloud.auto = true; }
    render(); toast("Datos borrados");
  },
};
function doImport(txt) {
  try { applySnapshot(JSON.parse(txt)); closeSheet(); render(); toast("Datos importados: " + S.tx.length + (S.tx.length === 1 ? " movimiento" : " movimientos")); }
  catch (e) { toast(e && e.message && e.message.indexOf("WalletMind") > -1 ? e.message : "Archivo inválido"); }
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, fn = (cur && cur.acts[a]) || ACT[a]; if (fn) fn(el, e);
});
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { S.q = e.target.value; const l = mvFiltered(); $("#mv-list").innerHTML = txGroups(l); $("#mv-sum").innerHTML = mvSummary(l); return; }
  if (cur && cur.onInput) cur.onInput(e);
});
document.addEventListener("change", (e) => {
  if (e.target.dataset && e.target.dataset.ch === "cur") { S.cur = e.target.value; persist("cur"); render(); toast("Moneda: " + S.cur); return; }
  if (cur && cur.onInput) cur.onInput(e);
});
$("#fab").addEventListener("click", () => ACT.add());

/* ---- tras un arrastre, ignora el clic fantasma ---- */
document.addEventListener("click", (e) => { if (performance.now() - lastDrag < 300) { e.preventDefault(); e.stopPropagation(); } }, true);

/* ---- filas: deslizar para eliminar (1:1, inercia proyectada, resorte con velocidad) ---- */
let openRow = null;
const setRowX = (fg, x) => { fg._x = x; fg.style.transform = x ? "translate3d(" + x + "px,0,0)" : ""; fg.previousElementSibling.style.opacity = Math.min(1, -x / 60); };
const rowTo = (fg, to, o) => spring("row" + fg.parentElement.dataset.sid, fg._x || 0, to, Object.assign({ response: 0.4, damping: 1, eps: 0.2, onUpdate: (x) => setRowX(fg, x) }, o));
document.addEventListener("pointerdown", (e) => {
  const fg = e.target.closest(".swipe-fg");
  if (openRow && openRow !== fg && !e.target.closest(".swipe-bg")) { rowTo(openRow, 0); openRow = null; }
  if (!fg || (e.pointerType === "mouse" && e.button !== 0)) return;
  const wrap = fg.parentElement, W = wrap.offsetWidth, x0 = fg._x || 0, px = e.clientX, py = e.clientY, pid = e.pointerId, hist = [{ t: e.timeStamp, x: e.clientX }];
  let on = false;
  const off = () => { fg.removeEventListener("pointermove", mv); fg.removeEventListener("pointerup", up); fg.removeEventListener("pointercancel", up); };
  const mv = (ev) => {
    if (ev.pointerId !== pid) return;
    const dx = ev.clientX - px, dy = ev.clientY - py;
    if (!on) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) return off();
      if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
      on = true; const s = live.get("row" + wrap.dataset.sid); if (s) s.stop(); try { fg.setPointerCapture(pid); } catch (x) {}
    }
    let x = x0 + dx; x = x < 0 ? Math.max(x, -W) : rubber(x, 260); setRowX(fg, x);
    hist.push({ t: ev.timeStamp, x: ev.clientX }); if (hist.length > 6) hist.shift();
  };
  const up = (ev) => {
    if (ev.pointerId !== pid) return; off(); if (!on) return; lastDrag = performance.now();
    const v = vel(hist, "x"), proj = fg._x + project(v), id = wrap.dataset.sid;
    if (fg._x < -W * 0.5 || (proj < -W * 0.75 && fg._x < -W * 0.3)) { buzz(14); openRow = null; rowTo(fg, -W, { v, response: 0.28, onDone: () => deleteTx(id, wrap) }); }
    else if (proj < -56) { openRow = fg; buzz(6); rowTo(fg, -88, { v, damping: Math.abs(v) > 300 ? 0.8 : 1 }); }
    else { if (openRow === fg) openRow = null; rowTo(fg, 0, { v }); }
  };
  fg.addEventListener("pointermove", mv); fg.addEventListener("pointerup", up); fg.addEventListener("pointercancel", up);
});

/* ---- tarjeta principal: se inclina hacia donde la tocas y vuelve con resorte ---- */
document.addEventListener("pointerdown", (e) => {
  const h = e.target.closest(".hero"); if (!h || reduced()) return;
  const r = h.getBoundingClientRect(), pid = e.pointerId; let ax = 0, ay = 0;
  const apply = () => { h.style.transform = "perspective(800px) rotateX(" + ax + "deg) rotateY(" + ay + "deg) scale(.985)"; };
  const go = (tx, ty, o) => {
    spring("tx", ax, tx, Object.assign({ eps: 0.01, onUpdate: (v) => { ax = v; apply(); } }, o));
    spring("ty", ay, ty, Object.assign({ eps: 0.01, onUpdate: (v) => { ay = v; apply(); } }, o));
  };
  const mv = (ev) => {
    if (ev.pointerId !== pid) return;
    const nx = Math.max(-0.5, Math.min(0.5, (ev.clientX - r.left) / r.width - 0.5)), ny = Math.max(-0.5, Math.min(0.5, (ev.clientY - r.top) / r.height - 0.5));
    h.style.setProperty("--gx", (nx + 0.5) * 100 + "%"); h.style.setProperty("--gy", (ny + 0.5) * 100 + "%");
    go(-ny * 9, nx * 11, { response: 0.2, damping: 1 });
  };
  const end = (ev) => {
    if (ev.pointerId !== pid) return;
    h.removeEventListener("pointermove", mv); h.removeEventListener("pointerup", end); h.removeEventListener("pointercancel", end);
    h.classList.remove("tl"); let left = 2; const fin = () => { if (--left === 0) h.style.transform = ""; };
    spring("ty", ay, 0, { response: 0.55, damping: 0.55, eps: 0.01, onUpdate: (v) => { ay = v; apply(); }, onDone: fin });
    spring("tx", ax, 0, { response: 0.55, damping: 0.55, eps: 0.01, onUpdate: (v) => { ax = v; apply(); }, onDone: fin });
  };
  h.classList.add("tl"); mv(e); h.addEventListener("pointermove", mv); h.addEventListener("pointerup", end); h.addEventListener("pointercancel", end);
});

/* ---- el botón + se esconde al bajar y reaparece al subir ---- */
let ly = window.scrollY;
window.addEventListener("scroll", () => { $("#edge").classList.toggle("on", window.scrollY > 8); const y = window.scrollY, d = y - ly; if (Math.abs(d) > 6) { $("#fab").classList.toggle("away", d > 0 && y > 80); ly = y; } }, { passive: true });
document.addEventListener("touchstart", function () {}, { passive: true }); // activa :active en iOS Safari

/* ============ bienvenida ============ */
function onboard() {
  const lang = (navigator.language || "en-US"), guess = { "es-MX": "MXN", "es-AR": "ARS", "es-CO": "COP", "es-CL": "CLP", "es-PE": "PEN", "es-VE": "VES", "es-ES": "EUR", "pt-BR": "BRL", "en-GB": "GBP", "en-CA": "CAD", "en-AU": "AUD", "ja-JP": "JPY", "de-CH": "CHF" }[lang] || "USD";
  openSheet({
    title: "Bienvenido a WalletMind",
    html: '<p class="mut">Controla ingresos, gastos, deudas e inversiones en un solo lugar. Tus datos se guardan en este dispositivo.</p><div class="field"><label for="o-cur">¿Con qué moneda trabajas?</label><select id="o-cur">' + CURS.map((c) => '<option value="' + c.c + '"' + (c.c === guess ? " selected" : "") + ">" + c.c + " · " + c.n + "</option>").join("") + '</select></div><div class="actions"><button class="btn primary" data-a="go">Empezar</button></div>',
    acts: { go() { S.cur = $("#o-cur", cur.el).value; persist("cur"); closeSheet(); render(); } },
  });
}

/* ============ arranque ============ */
load(); applyTheme(); S.priv = ls.getItem("wm_priv") === "1"; document.body.classList.toggle("priv", S.priv); render();
if (ls.getItem(K.cur) === null && !hasData()) setTimeout(onboard, 350);
initCloud().then(async () => {
  if (!cloud.ok) return;
  if (hasData()) { cloud.auto = true; return; }
  const m = await cloudMeta(); if (!m || !cloud.ok) { cloud.auto = true; return; }
  const yes = await confirmDlg({ title: "Encontré un respaldo", text: "Hay una copia guardada con " + m.tx + " movimientos. ¿Quieres restaurarla en este dispositivo?", ok: "Restaurar" });
  if (yes) { try { await restoreCloud(); closeSheet(); render(); toast("Datos restaurados"); } catch (e) { toast("No se pudo restaurar"); } }
  cloud.auto = yes;
});
})();
</script>
